<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}StreamBox{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body>
<nav><a class="brand" href="{{url_for('index')}}">▶ StreamBox</a><div>{% if current_user %}<a href="{{url_for('dashboard')}}">Dashboard</a><a class="btn small" href="{{url_for('upload')}}">Upload</a><a href="{{url_for('logout')}}">Logout</a>{% else %}<a href="{{url_for('login')}}">Login</a><a class="btn small" href="{{url_for('register')}}">Register</a>{% endif %}</div></nav>
{% with ms=get_flashed_messages(with_categories=true) %}<div class="alerts">{% for c,m in ms %}<div class="alert {{c}}">{{m}}</div>{% endfor %}</div>{% endwith %}<main>{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='js/app.js')}}"></script></body></html>
