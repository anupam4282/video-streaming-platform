{% extends "base.html" %}{% block title %}Upload{% endblock %}{% block content %}<div class="formbox wide"><small>VIDEO UPLOAD</small><h1>Upload a new video</h1><form method="post" enctype="multipart/form-data" class="form"><label>Title<input name="title" required maxlength="150"></label><label>Description<textarea name="description" rows="5"></textarea></label><label>Video<input id="videoInput" name="video" type="file" accept="video/*" required></label><p id="fileInfo">MP4, WebM, MOV, MKV, AVI, M4V</p><button class="btn">Upload video</button></form></div>{% endblock %}
